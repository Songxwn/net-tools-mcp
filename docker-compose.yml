services:
  net-tools-mcp:
    image: ghcr.io/songxwn/net-tools-mcp:latest
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      MCP_LISTEN: ":8080"
    cap_add:
      - NET_RAW
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
