name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false
      - name: Resolve modules and test
        run: |
          go mod tidy
          go test ./...
      - uses: actions/upload-artifact@v4
        with:
          name: gomod
          path: |
            go.mod
            go.sum
